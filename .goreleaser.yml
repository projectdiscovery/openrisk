version: 2

before:
  hooks:
    - go mod tidy

builds:
- id: openrisk
  env:
  - CGO_ENABLED=0
  binary: '{{ .ProjectName }}'
  main: ./cmd/openrisk

  goos:
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - 386
    - arm
    - arm64

  ignore:
    - goos: darwin
      goarch: '386'
    - goos: windows
      goarch: 'arm'
    - goos: windows
      goarch: 'arm64'

# docker-only: the published linux/arm image is arm/v7, but the openrisk build
# above compiles the default GOARM=6, so the image gets its own armv7 binary,
# which no archive ships.
- id: openrisk-docker-armv7
  env:
  - CGO_ENABLED=0
  binary: '{{ .ProjectName }}'
  main: ./cmd/openrisk

  goos:
    - linux
  goarch:
    - arm
  goarm:
    - 7

archives:
- ids:
    - openrisk
  formats: [zip]
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'

checksum:
  algorithm: sha256

dockers_v2:
- ids:
    - openrisk
    - openrisk-docker-armv7
  images:
    - projectdiscovery/openrisk
  tags:
    - '{{ .Tag }}'
    - latest
  labels:
    org.opencontainers.image.created: '{{ .Date }}'
    org.opencontainers.image.ref.name: '{{ .Tag }}'
    org.opencontainers.image.revision: '{{ .FullCommit }}'
    org.opencontainers.image.version: '{{ .Version }}'
  platforms:
    - linux/amd64
    - linux/arm64
    - linux/arm/v7
